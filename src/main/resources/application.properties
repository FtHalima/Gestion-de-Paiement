spring.datasource.url=jdbc:h2:file:${user.home}/GestionPaiements/data/gestion_paiements;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true
# L'application JavaFX utilise ses services directement : aucun port HTTP fixe requis.
# Un port disponible evite les conflits avec les autres applications locales.
server.port=0
